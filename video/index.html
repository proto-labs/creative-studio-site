    <title>Creative Studio</title>
    <script>
      // The theme before the first paint, so the page never flashes the other palette:
      // `?theme=light|dark`, else the system's. `ThemeProvider` (src/app/theme.tsx) takes
      // over from here with the same rule.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
